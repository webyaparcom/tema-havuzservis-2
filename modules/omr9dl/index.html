  .modulex-ust-ok-zincir-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-ust-ok-zincir-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }

  .modulex-ust-ok-zincir-oge { position: relative; display: inline-flex; align-items: center; min-height: 44px; color: inherit; font-weight: 600; text-decoration: none; transition: color 0.2s ease, background 0.2s ease; }
  .modulex-ust-ok-zincir-oge:hover, .modulex-ust-ok-zincir-oge[aria-current="page"] { color: --accentInk--; }
  .modulex-ust-ok-zincir-cta { display: inline-flex; flex: none; align-items: center; gap: 6px; min-height: 44px; padding: 8px 18px; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; white-space: nowrap; transition: transform 0.2s ease, box-shadow 0.2s ease; }
  .modulex-ust-ok-zincir-cta:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -12px --accent--; }
  .modulex-ust-ok-zincir-cta .material-symbols-outlined, .modulex-ust-ok-zincir-tel .material-symbols-outlined, .modulex-ust-ok-zincir-posta .material-symbols-outlined { font-size: 18px; }
  .modulex-ust-ok-zincir-tel, .modulex-ust-ok-zincir-posta { display: inline-flex; align-items: center; gap: 6px; color: inherit; text-decoration: none; white-space: nowrap; }
  .modulex-ust-ok-zincir-tel:hover, .modulex-ust-ok-zincir-posta:hover { color: --accentInk--; }
  .modulex-ust-ok-zincir-dil:empty { display: none; }
  .modulex-ust-ok-zincir-ac { display: none; align-items: center; gap: 10px; min-width: 46px; min-height: 46px; padding: 0 12px; border: 1px solid --cizgi--; border-radius: 999px; background: transparent; color: inherit; font: inherit; font-weight: 700; }
  .modulex-ust-ok-zincir-ac-ikon { display: grid; gap: 4px; width: 20px; }
  .modulex-ust-ok-zincir-ac-ikon span { display: block; height: 2px; border-radius: 2px; background: currentColor; transition: transform 0.3s ease, opacity 0.3s ease; }
  .modulex-ust-ok-zincir--acik .modulex-ust-ok-zincir-ac-ikon span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
  .modulex-ust-ok-zincir--acik .modulex-ust-ok-zincir-ac-ikon span:nth-child(2) { opacity: 0; }
  .modulex-ust-ok-zincir--acik .modulex-ust-ok-zincir-ac-ikon span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
  .modulex-ust-ok-zincir-kapat { display: inline-grid; place-items: center; width: 46px; height: 46px; border: 1px solid --cizgi--; border-radius: 50%; background: transparent; color: inherit; }
  .modulex-ust-ok-zincir-perde { position: fixed; inset: 0; z-index: 1; background: color-mix(in srgb, --text-- 45%, transparent); animation: modulex-ust-ok-zincir-sol 0.3s ease both; }
  @keyframes modulex-ust-ok-zincir-sol { from { opacity: 0; } to { opacity: 1; } }

  .modulex-ust-ok-zincir-panel { display: grid; gap: 14px; }
  @media (max-width: 1024px) {
    .modulex-ust-ok-zincir--js .modulex-ust-ok-zincir-nav, .modulex-ust-ok-zincir--js .modulex-ust-ok-zincir-genis { display: none; }
    .modulex-ust-ok-zincir--js .modulex-ust-ok-zincir-ac { display: inline-flex; }
    .modulex-ust-ok-zincir-panel { position: absolute; inset-inline: 0; inset-block-start: 100%; padding: 16px 20px 24px; border-block-end: 1px solid --cizgi--; background: --bg--; box-shadow: 0 24px 40px -28px color-mix(in srgb, --text-- 55%, transparent); animation: modulex-ust-ok-zincir-in 0.3s ease both; }
    .modulex-ust-ok-zincir-pliste { display: grid; }
    .modulex-ust-ok-zincir-pliste .modulex-ust-ok-zincir-oge { width: 100%; min-height: 50px; border-block-end: 1px solid --cizgi--; font-size: 1.05rem; }
    .modulex-ust-ok-zincir-palt { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  }
  @media (min-width: 1025px) {
    .modulex-ust-ok-zincir-panel { display: none !important; }
  }
  @keyframes modulex-ust-ok-zincir-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

  .modulex-ust-ok-zincir-cubuk { display: flex; align-items: center; justify-content: space-between; gap: 14px 26px; padding-block: 16px; }
  .modulex-ust-ok-zincir-zincir { display: flex; flex-wrap: wrap; align-items: center; row-gap: 6px; }
  .modulex-ust-ok-zincir-zincir > li + li { margin-inline-start: -8px; }
  .modulex-ust-ok-zincir-halka { --ok: 16px; display: inline-flex; align-items: center; min-height: 46px; padding-inline: calc(var(--ok) + 14px) calc(var(--ok) + 8px); background-color: color-mix(in srgb, --text-- 9%, --bg--); color: inherit; font-weight: 700; text-decoration: none; clip-path: polygon(0 0, calc(100% - var(--ok)) 0, 100% 50%, calc(100% - var(--ok)) 100%, 0 100%, var(--ok) 50%); transition: background-color 0.25s ease, color 0.25s ease, transform 0.2s ease; }
  .modulex-ust-ok-zincir-zincir > li:first-child .modulex-ust-ok-zincir-halka { padding-inline-start: 18px; clip-path: polygon(0 0, calc(100% - var(--ok)) 0, 100% 50%, calc(100% - var(--ok)) 100%, 0 100%); }
  [dir="rtl"] .modulex-ust-ok-zincir-halka { clip-path: polygon(100% 0, var(--ok) 0, 0 50%, var(--ok) 100%, 100% 100%, calc(100% - var(--ok)) 50%); }
  [dir="rtl"] .modulex-ust-ok-zincir-zincir > li:first-child .modulex-ust-ok-zincir-halka { clip-path: polygon(100% 0, var(--ok) 0, 0 50%, var(--ok) 100%, 100% 100%); }
  .modulex-ust-ok-zincir-halka:hover { background-color: color-mix(in srgb, --accent-- 18%, --bg--); }
  .modulex-ust-ok-zincir-halka:active { transform: translateY(1px); }
  .modulex-ust-ok-zincir-halka[aria-current="page"] { background-color: --accent--; color: --accentText--; }
  .modulex-ust-ok-zincir-cubuk > .modulex-ust-ok-zincir-son { display: flex; align-items: center; gap: 12px; }
  .modulex-ust-ok-zincir-genis { display: flex; align-items: center; gap: 12px; }
  .modulex-ust-ok-zincir-pzincir { display: grid; gap: 4px; }
  .modulex-ust-ok-zincir-phalka { display: flex; align-items: center; min-height: 54px; padding: 6px 16px 14px; background-color: color-mix(in srgb, --text-- 7%, --bg--); color: inherit; font-weight: 700; text-decoration: none; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), 50% 100%, 0 calc(100% - 10px)); transition: background-color 0.25s ease; }
  .modulex-ust-ok-zincir-phalka:hover { background-color: color-mix(in srgb, --accent-- 16%, --bg--); }
  .modulex-ust-ok-zincir-phalka[aria-current="page"] { background-color: --accent--; color: --accentText--; }
  @media (max-width: 1024px) {
    .modulex-ust-ok-zincir:not(.modulex-ust-ok-zincir--js) .modulex-ust-ok-zincir-cubuk { flex-wrap: wrap; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ust-ok-zincir :is(.modulex-ust-ok-zincir-baslik, .modulex-ust-ok-zincir-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ust-ok-zincir-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-ust-ok-zincir { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-ust-ok-zincir *, .modulex-ust-ok-zincir *::before, .modulex-ust-ok-zincir *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-ust-ok-zincir";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const cekmece = (s, P) => {
          const ac = s.querySelector("." + P + "-ac");
          const panel = ac ? document.getElementById(ac.getAttribute("aria-controls")) : null;
          if (!ac || !panel) return;
          s.classList.add(P + "--js");
          const perde = s.querySelector("." + P + "-perde");
          const modal = panel.getAttribute("aria-modal") === "true";
          const kok = document.documentElement;
          const kapa = (odak) => {
            if (panel.hidden) return;
            panel.hidden = true;
            if (perde) perde.hidden = true;
            ac.setAttribute("aria-expanded", "false");
            s.classList.remove(P + "--acik");
            if (modal) kok.style.overflow = "";
            if (odak) ac.focus();
          };
          const aci = () => {
            panel.hidden = false;
            if (perde) perde.hidden = false;
            ac.setAttribute("aria-expanded", "true");
            s.classList.add(P + "--acik");
            if (modal) kok.style.overflow = "hidden";
            const ilk = panel.querySelector("a[href], button");
            if (ilk) ilk.focus();
          };
          ac.addEventListener("click", () => (panel.hidden ? aci() : kapa(true)));
          panel.addEventListener("click", (e) => {
            if (e.target.closest("." + P + "-kapat")) kapa(true);
            else if (e.target.closest("a[href]")) kapa(false);
          });
          if (perde) perde.addEventListener("click", () => kapa(true));
          document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !panel.hidden) kapa(true); });
          if (modal) {
            panel.addEventListener("keydown", (e) => {
              if (e.key !== "Tab") return;
              const o = [...panel.querySelectorAll("a[href], button:not([disabled])")].filter((x) => x.offsetParent !== null);
              if (!o.length) return;
              if (e.shiftKey && document.activeElement === o[0]) { e.preventDefault(); o[o.length - 1].focus(); }
              else if (!e.shiftKey && document.activeElement === o[o.length - 1]) { e.preventDefault(); o[0].focus(); }
            });
          }
          const g = Number(ac.dataset.genis);
          if (g && window.matchMedia) window.matchMedia(`(min-width: ${g}px)`).addEventListener("change", (m) => { if (m.matches) kapa(false); });
        };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      cekmece(s, P, az);
    });
  })();
</script>
