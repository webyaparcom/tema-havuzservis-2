<section class="modulex-sayac-kulvar{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-sayac-kulvar-ic">
    {{fbbas}}

<style>
  /* sayac-kulvar — sayac-puan-kirilim çentikli ölçekte imleç, sayac-cubuk dolgu çubuğu kullanır; bu modül tek bir havuz kabı içinde numaralı kulvar şeritleri + şamandıralı halat ayraçları + iz bırakan yüzücü iskeletidir (yarış/antrenman ilerlemesi dili). */
  .modulex-sayac-kulvar { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-sayac-kulvar *, .modulex-sayac-kulvar *::before, .modulex-sayac-kulvar *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-sayac-kulvar :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-sayac-kulvar :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-sayac-kulvar :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-sayac-kulvar :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-sayac-kulvar img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-sayac-kulvar) img { height: auto; }
  .modulex-sayac-kulvar [hidden] { display: none !important; }
  .modulex-sayac-kulvar :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-sayac-kulvar :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-sayac-kulvar-ic { max-width: --max--; margin-inline: auto; }
  .modulex-sayac-kulvar-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-sayac-kulvar--bassiz .modulex-sayac-kulvar-bas { display: none; }
  .modulex-sayac-kulvar-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-sayac-kulvar-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-sayac-kulvar-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-sayac-kulvar-bas { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 48px; align-items: end; }
  .modulex-sayac-kulvar-ust { grid-column: 1 / -1; }
  .modulex-sayac-kulvar-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-sayac-kulvar-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-sayac-kulvar-dugme:hover { transform: translateY(-2px); }
  .modulex-sayac-kulvar-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-sayac-kulvar-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-sayac-kulvar-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-sayac-kulvar-havuz { display: grid; overflow: hidden; border: 10px solid --kartBg--; border-radius: --yuvarlak--; background: linear-gradient(180deg, color-mix(in srgb, --accent-- 7%, --bg--), color-mix(in srgb, --accent-- 13%, --bg--)), color-mix(in srgb, --accent-- 10%, --bg--); box-shadow: 0 0 0 1px --cizgi--, 0 30px 60px -40px color-mix(in srgb, --accent-- 60%, transparent); }
  .modulex-sayac-kulvar-kulvar { position: relative; display: grid; grid-template-columns: 72px minmax(0, 1fr); align-items: stretch; }
  .modulex-sayac-kulvar-kulvar + .modulex-sayac-kulvar-kulvar::before { content: ""; position: absolute; inset-inline: 0; inset-block-start: -3px; z-index: 1; height: 6px; border-radius: 3px; background: repeating-linear-gradient(90deg, --accent-- 0 14px, --bg-- 14px 28px); }
  .modulex-sayac-kulvar-kno { display: grid; place-items: center; border-inline-end: 4px solid color-mix(in srgb, --text-- 70%, transparent); background: --kartBg--; color: --text--; font-family: var(--mx-font-mono, ui-monospace, monospace); font-size: 1.5rem; font-weight: 800; }
  .modulex-sayac-kulvar-kgovde { display: grid; gap: 8px; padding: 18px clamp(16px, 2.4vw, 28px); }
  .modulex-sayac-kulvar-kbas { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  .modulex-sayac-kulvar-etiket { display: flex; align-items: center; gap: 8px; font-size: 1.05rem; font-weight: 700; }
  .modulex-sayac-kulvar-ikon { color: --accentInk--; font-size: 20px; }
  .modulex-sayac-kulvar-sayi { flex: none; font-size: clamp(1.6rem, 2.8vw, 2.2rem); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .modulex-sayac-kulvar-ek { color: --accentInk--; font-size: 0.6em; }
  .modulex-sayac-kulvar-parkur { position: relative; height: 40px; }
  .modulex-sayac-kulvar-iz { position: absolute; inset-inline: 0; inset-block-start: calc(50% - 2px); height: 4px; border-radius: 2px; background: color-mix(in srgb, --text-- 20%, transparent); }
  .modulex-sayac-kulvar-iz::before { content: ""; position: absolute; inset-block: 0; inset-inline-start: 0; width: calc(var(--o) * (100% - 40px) + 20px); border-radius: inherit; background: linear-gradient(90deg, transparent, --accent--); transition: width 1.6s cubic-bezier(0.25, 0.8, 0.25, 1); transition-delay: calc(var(--i) * 0.15s); }
  [dir="rtl"] .modulex-sayac-kulvar-iz::before { background: linear-gradient(270deg, transparent, --accent--); }
  .modulex-sayac-kulvar-duvar { position: absolute; inset-block: 4px; inset-inline-end: 0; width: 4px; border-radius: 2px; background: color-mix(in srgb, --text-- 50%, transparent); }
  .modulex-sayac-kulvar-yuzucu { position: absolute; inset-block-start: 0; inset-inline-start: calc(var(--o) * (100% - 40px)); display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: --accent--; color: --accentText--; box-shadow: 0 0 0 6px color-mix(in srgb, --accent-- 20%, transparent); transition: inset-inline-start 1.6s cubic-bezier(0.25, 0.8, 0.25, 1); transition-delay: calc(var(--i) * 0.15s); }
  .modulex-sayac-kulvar-yuzucu .material-symbols-outlined { font-size: 22px; }
  [dir="rtl"] .modulex-sayac-kulvar-yuzucu .material-symbols-outlined { transform: scaleX(-1); }
  .modulex-sayac-kulvar--hazir:not(.modulex-sayac-kulvar--gor) .modulex-sayac-kulvar-yuzucu { inset-inline-start: 0; }
  .modulex-sayac-kulvar--hazir:not(.modulex-sayac-kulvar--gor) .modulex-sayac-kulvar-iz::before { width: 0; }
  .modulex-sayac-kulvar-kulvar:hover .modulex-sayac-kulvar-yuzucu { animation: modulex-sayac-kulvar-kulac 0.8s ease-in-out 2; }
  @keyframes modulex-sayac-kulvar-kulac { 50% { transform: translateY(-4px) rotate(-8deg); } }
  .modulex-sayac-kulvar-not { color: --muted--; font-size: 0.9rem; }
  @media (max-width: 768px) {
    .modulex-sayac-kulvar-havuz { border-width: 6px; }
    .modulex-sayac-kulvar-kulvar { grid-template-columns: 44px minmax(0, 1fr); }
    .modulex-sayac-kulvar-kno { font-size: 1.05rem; }
    .modulex-sayac-kulvar-kbas { flex-wrap: wrap; gap: 4px 12px; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-kulvar :is(.modulex-sayac-kulvar-baslik, .modulex-sayac-kulvar-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-kulvar-baslik { line-height: 1.35; }
  @media (max-width: 1024px) {
    .modulex-sayac-kulvar-bas { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 768px) {
    .modulex-sayac-kulvar { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-sayac-kulvar *, .modulex-sayac-kulvar *::before, .modulex-sayac-kulvar *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-sayac-kulvar";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    const sayac = (s, P, az) => {
        const el = [...s.querySelectorAll("[data-hedef]")];
        if (!el.length || az || !("IntersectionObserver" in window)) return;
        const dl = document.documentElement.lang || undefined;
        const oynat = () => el.forEach((e) => {
          const h = Number(e.dataset.hedef);
          const od = Number(e.dataset.ondalik) || 0;
          const son = e.textContent;
          if (!Number.isFinite(h)) return;
          let f;
          try { f = new Intl.NumberFormat(dl, { minimumFractionDigits: od, maximumFractionDigits: od }); } catch (x) { return; }
          const t0 = performance.now();
          const adim = (t) => {
            const p = Math.min(1, (t - t0) / 1300);
            e.textContent = p < 1 ? f.format(h * (1 - Math.pow(1 - p, 3))) : son;
            if (p < 1) requestAnimationFrame(adim);
          };
          requestAnimationFrame(adim);
        });
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { oynat(); io.disconnect(); } });
        }, { threshold: 0.3 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
      sayac(s, P, az);
    });
  })();
</script>
